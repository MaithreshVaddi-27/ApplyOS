# Unified provider registry — the single answer to "which boards exist".
#
# One `implementation` per board: the SDK module in applyos/packages/provider/src/.
# `surfaces` are the thin CLI/engine adapters over it, never implementations.
# `enabled: false` is the only field the health check may change, with confirmation.
# A provider whose `implementation` is absent is reported `skipped (not installed)`.
providers:
  - id: remoteok
    kind: aggregator
    implementation: applyos/packages/provider/src/remoteok.ts
    surfaces: [.agents/skills/remoteok-search, applyos/packages/portals/src/remoteok.ts]
    enabled: true
    markets: [global]
  - id: remotive
    kind: aggregator
    implementation: applyos/packages/provider/src/remotive.ts
    surfaces: [.agents/skills/remotive-search, applyos/packages/portals/src/remotive.ts]
    enabled: true
    markets: [global]
  - id: freehire
    kind: aggregator
    implementation: applyos/packages/provider/src/freehire.ts
    surfaces: [.agents/skills/freehire-search, applyos/packages/portals/src/freehire.ts]
    enabled: true
    markets: [global]
  - id: unstop
    kind: aggregator
    implementation: applyos/packages/provider/src/unstop.ts
    surfaces: [.agents/skills/unstop-search, applyos/packages/portals/src/unstop.ts]
    enabled: true
